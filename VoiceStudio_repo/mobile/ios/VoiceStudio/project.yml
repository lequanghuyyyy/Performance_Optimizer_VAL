name: VoiceStudio
options:
  bundleIdPrefix: com.voicestudio
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en
packages:
  VoiceStudioKit:
    path: ../VoiceStudioKit
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: 'NO'
targets:
  VoiceStudio:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Features
      - path: Platform
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicestudio.mobile
        GENERATE_INFOPLIST_FILE: 'NO'
        INFOPLIST_FILE: $(DERIVED_FILE_DIR)/VoiceStudio-Info.plist
    dependencies:
      - package: VoiceStudioKit
    preBuildScripts:
      - name: Bundle catalogs and derive version
        script: |
          set -eu
          python3 "$SRCROOT/../scripts/prepare_resources.py" --output "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" --info-output "$DERIVED_FILE_DIR/VoiceStudio-Info.plist"
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/../../../package.json
          - $(SRCROOT)/Info.plist
        outputFiles:
          - $(DERIVED_FILE_DIR)/VoiceStudio-Info.plist
  VoiceStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../VoiceStudioUITests
    dependencies:
      - target: VoiceStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
schemes:
  VoiceStudio:
    build:
      targets:
        VoiceStudio: all
    test:
      targets:
        - VoiceStudioUITests
